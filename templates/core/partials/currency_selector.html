{% load i18n %}
<div class="relative z-50" x-data="{ open: false }" @mouseenter="open = true" @mouseleave="open = false">
    <form action="{% url 'set_currency' %}" method="POST" id="currency-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}" id="currency-next">
        <input type="hidden" name="currency" id="currency-input">
        <div class="flex items-center cursor-pointer hover:text-white py-2">
            {% trans "Currency:" %}
            <span class="text-white ml-1 font-bold">{{ currency_symbol }}</span>
            <span class="ml-1 text-[10px] text-gray-500">({{ currency_code }})</span>
            <i data-lucide="chevron-down" class="ml-1 w-2.5 h-2.5 transition-transform duration-200"
                :class="{ 'rotate-180': open }"></i>
        </div>
    </form>
    <!-- Dropdown -->
    <div x-show="open" style="display: none;" x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 translate-y-1"
        class="absolute right-0 top-full mt-0 w-32 bg-white text-black shadow-xl rounded overflow-hidden">
        {% for code, details in currencies.items %}
        <div onclick="document.getElementById('currency-input').value='{{ code }}'; document.getElementById('currency-next').value = window.location.pathname + window.location.search; document.getElementById('currency-form').submit();"
            class="px-4 py-2 hover:bg-gray-100 cursor-pointer flex justify-between items-center text-xs font-bold {% if code == currency_code %}bg-gray-100{% endif %}">
            <span>{{ details.name }}</span>
            <span class="text-gray-500">{{ details.symbol }}</span>
        </div>
        {% endfor %}
    </div>
</div>
