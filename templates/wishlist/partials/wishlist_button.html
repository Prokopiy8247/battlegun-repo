<button
    class="bg-white/90 hover:bg-orange-500 hover:text-white {% if in_wishlist %}text-red-500{% else %}text-gray-600{% endif %} p-1.5 rounded shadow-sm transition-colors"
    hx-post="{% url 'wishlist_toggle' product.id %}" hx-swap="outerHTML"
    title="{% if in_wishlist %}Remove from Wishlist{% else %}Add to Wishlist{% endif %}">
    <i data-lucide="heart" class="w-3.5 h-3.5 {% if in_wishlist %}fill-current{% endif %}"></i>
</button>
